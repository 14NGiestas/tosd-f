name: fpm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned SPEC corpus commit (brunoborges/toml-schema). Bump deliberately:
  # raising TOSD_CONFORMANCE_MIN_PASS only after the tally improves.
  SPEC_SHA: 60ff76d18698f09499821e331baa6819745c24f6
  TOSD_CONFORMANCE_MIN_PASS: 42

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          extra-experimental-features = nix-command flakes

    - name: Enable Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main

    - name: Build and test
      # No env vars set: docs_dir_scan skips, the other 9 tests run.
      run: nix develop --command bash -c "fortran-fpm test"

    - name: Checkout SPEC corpus
      uses: actions/checkout@v4
      with:
        repository: brunoborges/toml-schema
        ref: ${{ env.SPEC_SHA }}
        path: spec-corpus
        sparse-checkout: conformance

    - name: Conformance (flags regressions)
      run: |
        nix develop --command bash -c "TOSD_CONFORMANCE_DIR=$PWD/spec-corpus/conformance \
          TOSD_CONFORMANCE_MIN_PASS=$TOSD_CONFORMANCE_MIN_PASS fortran-fpm test"
