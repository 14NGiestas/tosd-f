name = "tosd-f"
version = "0.1.0"
author = "Ian Giestas Pauli"
maintainer = "iangiestaspauli@gmail.com"
copyright = "Copyright 2026, Ian Giestas Pauli"
description = "TOML Schema (.tosd) validation in pure Fortran: validates TOML documents against a schema written in TOML."
license = "Apache-2.0 OR MIT"
keywords = ["toml", "schema", "validation", "config"]
categories = ["configuration", "io"]

# Upstream toml-f (https://github.com/toml-f/toml-f). Pinned to upstream rather
# than any fork: this package is public and standalone, and fpm resolves a
# dependency by source URL -- a fork pin here would collide with a different
# toml-f elsewhere in a consumer's build.
[dependencies]
toml-f = { git = "https://github.com/toml-f/toml-f" }

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive" }

[library]
source-dir = "src"

[[test]]
name = "run_tests"
source-dir = "test"

[build]
auto-executables = false
auto-tests = false
auto-examples = false
