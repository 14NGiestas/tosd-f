name = "tosd-f"
version = "0.1.0"
author = "Ian Giestas Pauli"
maintainer = "iangiestaspauli@gmail.com"
copyright = "Copyright 2026, Ian Giestas Pauli"
description = "TOML Schema (.tosd) validation in pure Fortran: validates TOML documents against a schema written in TOML."
license = "Apache-2.0 OR MIT"
keywords = ["toml", "schema", "validation", "config"]
categories = ["configuration", "io"]

# The same toml-f source our downstream users pin, so fpm resolves a single
# toml-f when this package is used as a dependency (two different sources of
# the same Fortran module names would collide).
[dependencies]
toml-f = { git = "https://github.com/14NGiestas/toml-f" }

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive" }

[library]
source-dir = "src"

[[test]]
name = "run_tests"
source-dir = "test"

[build]
auto-executables = false
auto-tests = false
auto-examples = false
